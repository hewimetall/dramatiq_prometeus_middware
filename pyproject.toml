[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dramatiq-prometheus-fix"
version = "0.1.0"
description = "Drop-in Dramatiq Prometheus middleware with correct delayed-message gauges."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["dramatiq", "prometheus", "metrics", "delayed-messages"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "dramatiq>=1.15",
    "prometheus-client>=0.20",
]

[project.scripts]
dramatiq-prometheus = "dramatiq_prometheus_fix.cli:main"

[project.urls]
Documentation = "https://github.com/Bogdanp/dramatiq/issues/672"
Source = "https://github.com/Bogdanp/dramatiq/blob/master/dramatiq/middleware/prometheus.py"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
